<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR เกมเรียงประโยคภาษาไทย</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Kanit -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- MediaPipe Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body { font-family: 'Kanit', sans-serif; overflow: hidden; touch-action: none; user-select: none; }
        #canvas-container { position: relative; width: 100vw; height: 100vh; background-color: #1a202c; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; }
        video { display: none; }
        
        /* Glassmorphism Classes for UI Layer */
        .glass { background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); }
    </style>
</head>
<body class="bg-gray-900 text-white">

    <!-- Start Screen (HTML UI) -->
    <div id="start-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-gray-900 z-50">
        <h1 class="text-5xl md:text-7xl font-bold mb-6 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-green-400">เกมเรียงประโยค AR</h1>
        <p class="text-xl mb-10 text-gray-300">ใช้มือของคุณจับคำศัพท์มาเรียงให้ถูกต้อง!</p>
        <button id="btn-enter" class="px-8 py-4 bg-blue-600 hover:bg-blue-500 rounded-full text-2xl font-semibold transition-transform transform hover:scale-105 shadow-[0_0_15px_rgba(37,99,235,0.6)]">
            เข้าสู่เกม (Start)
        </button>
    </div>

    <!-- End Game Screen -->
    <div id="end-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-black/80 z-50 hidden glass">
        <h1 class="text-6xl font-bold text-green-400 mb-6">เก่งมาก ! 🎉</h1>
        <p class="text-3xl mb-8">คุณทำคะแนนได้: <span id="final-score" class="text-yellow-400"></span></p>
        <button onclick="location.reload()" class="px-8 py-4 bg-green-500 hover:bg-green-400 rounded-full text-2xl font-semibold text-white">
            เล่นอีกครั้ง
        </button>
    </div>

    <!-- Warning Message (Hand Not Found) -->
    <div id="warning-msg" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-red-600/80 px-6 py-3 rounded-full text-xl z-20 hidden backdrop-blur-sm transition-opacity duration-300">
        ⚠️ กำลังหามือของคุณ... (ใช้เมาส์แทนได้)
    </div>

    <!-- Canvas Container -->
    <div id="canvas-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="game-canvas"></canvas>
    </div>

    <script>
        // --- 1. Game Data & Variables ---
        const levels = [
            { prompt: "ฉัน กิน ข้าว", words: [{word: "ฉัน", emoji: "🧑"}, {word: "กิน", emoji: "🍽️"}, {word: "ข้าว", emoji: "🍚"}] },
            { prompt: "แมว กิน ปลา", words: [{word: "แมว", emoji: "🐱"}, {word: "กิน", emoji: "🐟"}, {word: "ปลา", emoji: "🍣"}] },
            { prompt: "นก บิน บน ท้องฟ้า", words: [{word: "นก", emoji: "🐦"}, {word: "บิน", emoji: "🕊️"}, {word: "บน", emoji: "☁️"}, {word: "ท้องฟ้า", emoji: "🌤️"}] }
        ];

        let currentLevel = 0;
        let score = 0;
        let gameState = 'IDLE'; // IDLE, INTRO, PLAYING, END
        
        let canvas, ctx, video;
        let W, H;
        
        // Game Objects
        let cards = [];
        let slots = [];
        let introButton = { x: 0, y: 0, w: 220, h: 80, text: "เริ่มเกม!" };

        // Interaction State
        let cursor = { x: 0, y: 0, active: false };
        let isGrabbing = false;
        let wasGrabbing = false;
        let cursorState = 'normal'; // normal, hover, grab_success, grab_miss
        let draggedCard = null;
        let handDetected = false;
        let lastHandDetectTime = Date.now();

        // Mouse Fallback
        let mousePoint = { x: -100, y: -100, isDown: false, active: true };

        // MediaPipe Results
        let latestHandResults = null;

        // --- 2. Initialization ---
        window.onload = () => {
            canvas = document.getElementById('game-canvas');
            ctx = canvas.getContext('2d');
            video = document.getElementById('webcam');
            
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            setupInputFallback();

            document.getElementById('btn-enter').addEventListener('click', () => {
                document.getElementById('start-screen').classList.add('hidden');
                initMediaPipe();
                gameState = 'INTRO';
                requestAnimationFrame(drawLoop);
            });
        };

        function resizeCanvas() {
            W = window.innerWidth;
            H = window.innerHeight;
            canvas.width = W;
            canvas.height = H;
            introButton.x = W / 2;
            introButton.y = H / 2;
        }

        // --- 3. MediaPipe Setup ---
        function initMediaPipe() {
            const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.6,
                minTrackingConfidence: 0.6
            });
            hands.onResults(onHandResults);

            const camera = new Camera(video, {
                onFrame: async () => { await hands.send({image: video}); },
                width: 1280, height: 720
            });
            camera.start();
        }

        function onHandResults(results) {
            latestHandResults = results;
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                handDetected = true;
                lastHandDetectTime = Date.now();
                mousePoint.active = false; // Disable mouse if hand is active
            }
        }

        // --- 4. Logic & Math (Pythagoras) ---
        // คำนวณระยะห่างด้วยพีทาโกรัส
        function getDistance(p1, p2) {
            let dx = (p1.x - p2.x) * W;
            let dy = (p1.y - p2.y) * H;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function checkGrabAction(landmarks) {
            const thumb = landmarks[4];
            const index = landmarks[8];
            const middle = landmarks[12];
            const ring = landmarks[16];
            const pinky = landmarks[20];

            // ระยะห่างนิ้วโป้งกับนิ้วอื่นๆ
            const dIndex = getDistance(thumb, index);
            const dMiddle = getDistance(thumb, middle);
            const dRing = getDistance(thumb, ring);
            const dPinky = getDistance(thumb, pinky);

            // จีบนิ้ว (Pinch): นิ้วโป้งและชี้ใกล้กันมาก
            const isPinch = dIndex < 50; 
            
            // กำมือ (Grasp): ปลายนิ้วทุกนิ้วงอเข้ามาใกล้โคนหรือใกล้กัน (วัดจากนิ้วโป้งเป็นหลัก)
            const isGrasp = dIndex < 80 && dMiddle < 80 && dRing < 80 && dPinky < 80;

            return isPinch || isGrasp;
        }

        function rectIntersect(cx, cy, rx, ry, rw, rh) {
            return cx >= rx - rw/2 && cx <= rx + rw/2 && cy >= ry - rh/2 && cy <= ry + rh/2;
        }

        // --- 5. Game Level Setup ---
        function loadLevel(levelIndex) {
            if(levelIndex >= levels.length) {
                gameState = 'END';
                document.getElementById('end-screen').classList.remove('hidden');
                document.getElementById('final-score').innerText = score;
                return;
            }
            
            const levelData = levels[levelIndex];
            cards = [];
            slots = [];
            
            const numWords = levelData.words.length;
            const slotWidth = 140, slotHeight = 160, gap = 20;
            const startX = (W - (numWords * slotWidth + (numWords - 1) * gap)) / 2;

            levelData.words.forEach((item, i) => {
                // สร้างช่องว่าง (Slots)
                slots.push({
                    x: startX + i * (slotWidth + gap) + slotWidth/2,
                    y: H - 120,
                    w: slotWidth, h: slotHeight,
                    targetWord: item.word,
                    filledBy: null
                });

                // สร้างการ์ด (สุ่มตำแหน่งด้านบน)
                cards.push({
                    id: i,
                    word: item.word,
                    emoji: item.emoji,
                    x: Math.random() * (W - 300) + 150,
                    y: Math.random() * (H/2 - 100) + 150,
                    w: 130, h: 150,
                    isLocked: false
                });
            });
        }

        // --- 6. Main Game Loop (แยกอิสระจาก MediaPipe) ---
        function drawLoop() {
            if (gameState === 'IDLE') return;

            ctx.clearRect(0, 0, W, H);

            // 6.1 วาดวิดีโอพื้นหลัง (แก้กล้องกลับด้าน - ป้องกัน Mirror)
            if (video.readyState >= 2) {
                ctx.save();
                ctx.translate(W, 0); // เลื่อนแกน x ไปขวาสุด
                ctx.scale(-1, 1);    // กลับด้านแกน x
                ctx.drawImage(video, 0, 0, W, H);
                ctx.restore();
            }

            // 6.2 อัปเดตข้อมูลมือหรือเมาส์
            updateInput();

            // 6.3 ประมวลผลลอจิกเกม
            if (gameState === 'INTRO') {
                processIntroLogic();
                drawIntroUI();
            } else if (gameState === 'PLAYING') {
                processGameLogic();
                drawGameUI();
            }

            // 6.4 วาดเคอร์เซอร์และการแสดงผลนิ้วมือ (UI Layer บนสุด)
            drawTrackingAndCursor();

            requestAnimationFrame(drawLoop);
        }

        function updateInput() {
            let now = Date.now();
            if (now - lastHandDetectTime > 1000) {
                handDetected = false;
                mousePoint.active = true; // เปิดใช้งานเมาส์ถ้าไม่เจอมือ
                if(gameState === 'PLAYING') document.getElementById('warning-msg').classList.remove('hidden');
            } else {
                if(gameState === 'PLAYING') document.getElementById('warning-msg').classList.add('hidden');
            }

            wasGrabbing = isGrabbing;

            if (handDetected && latestHandResults && latestHandResults.multiHandLandmarks.length > 0) {
                const landmarks = latestHandResults.multiHandLandmarks[0];
                const indexTip = landmarks[8];
                // แปลงพิกัดแบบกลับด้าน (Mirrored) ให้ตรงกับภาพที่กลับด้าน
                cursor.x = (1 - indexTip.x) * W; 
                cursor.y = indexTip.y * H;
                cursor.active = true;
                isGrabbing = checkGrabAction(landmarks);
            } else if (mousePoint.active) {
                cursor.x = mousePoint.x;
                cursor.y = mousePoint.y;
                cursor.active = true;
                isGrabbing = mousePoint.isDown;
            } else {
                cursor.active = false;
                isGrabbing = false;
            }
        }

        // --- 7. Game States Logic ---
        function processIntroLogic() {
            let isHover = rectIntersect(cursor.x, cursor.y, introButton.x, introButton.y, introButton.w, introButton.h);
            cursorState = isHover ? 'hover' : 'normal';

            // ถ้าจีบนิ้ว/คลิก บนปุ่ม เริ่มเกม
            if (isHover && isGrabbing && !wasGrabbing) {
                gameState = 'PLAYING';
                loadLevel(0);
            }
        }

        function processGameLogic() {
            let hoveredCard = null;
            
            // ห้ามขยับการ์ดที่ล็อคแล้ว
            for (let i = cards.length - 1; i >= 0; i--) {
                if (!cards[i].isLocked && rectIntersect(cursor.x, cursor.y, cards[i].x, cards[i].y, cards[i].w, cards[i].h)) {
                    hoveredCard = cards[i];
                    break;
                }
            }

            cursorState = hoveredCard ? 'hover' : 'normal';

            // เริ่มหยิบ (Just Pressed)
            if (isGrabbing && !wasGrabbing) {
                if (hoveredCard) {
                    draggedCard = hoveredCard;
                    cursorState = 'grab_success';
                } else {
                    cursorState = 'grab_miss'; // วืด
                }
            }

            // ลาก (Dragging)
            if (isGrabbing && draggedCard) {
                draggedCard.x = cursor.x;
                draggedCard.y = cursor.y;
                cursorState = 'grab_success';
            }

            // ปล่อย (Release)
            if (!isGrabbing && wasGrabbing) {
                if (draggedCard) {
                    // เช็คว่าปล่อยลงช่องไหน
                    let snapped = false;
                    for (let s of slots) {
                        if (rectIntersect(draggedCard.x, draggedCard.y, s.x, s.y, s.w, s.h)) {
                            // เช็คคำตอบ
                            if (draggedCard.word === s.targetWord) {
                                draggedCard.x = s.x;
                                draggedCard.y = s.y;
                                draggedCard.isLocked = true;
                                s.filledBy = draggedCard;
                                snapped = true;
                                score += Math.floor(100 / levels[currentLevel].words.length);
                            }
                            break;
                        }
                    }
                    draggedCard = null;
                    checkLevelWin();
                }
            }

            if(isGrabbing && !draggedCard) cursorState = 'grab_miss';
        }

        function checkLevelWin() {
            if (cards.every(c => c.isLocked)) {
                setTimeout(() => {
                    currentLevel++;
                    loadLevel(currentLevel);
                }, 1500); // ดีเลย์ก่อนไปด่านต่อไป
            }
        }

        // --- 8. Drawing Functions ---
        function drawIntroUI() {
            // Glassmorphism Button
            ctx.save();
            ctx.fillStyle = cursorState === 'hover' ? 'rgba(74, 222, 128, 0.9)' : 'rgba(34, 197, 94, 0.8)';
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.roundRect(introButton.x - introButton.w/2, introButton.y - introButton.h/2, introButton.w, introButton.h, 25);
            ctx.fill();
            
            ctx.fillStyle = 'white';
            ctx.font = 'bold 36px Kanit';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(introButton.text, introButton.x, introButton.y);
            ctx.restore();
        }

        function drawGameUI() {
            const levelData = levels[currentLevel];
            
            // Draw Header & Score (Glassmorphism Panel)
            ctx.save();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.shadowColor = 'rgba(0,0,0,0.2)';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.roundRect(20, 20, 450, 100, 20);
            ctx.fill();
            
            ctx.fillStyle = 'white';
            ctx.textAlign = 'left';
            ctx.font = '28px Kanit';
            ctx.fillText(`ด่านที่ ${currentLevel + 1}: ${levelData.prompt}`, 40, 55);
            ctx.fillStyle = '#facc15';
            ctx.fillText(`คะแนน: ${score}`, 40, 95);
            ctx.restore();

            // Draw Slots
            slots.forEach(s => {
                ctx.save();
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.lineWidth = 3;
                ctx.setLineDash([10, 10]);
                ctx.beginPath();
                ctx.roundRect(s.x - s.w/2, s.y - s.h/2, s.w, s.h, 15);
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            });

            // Draw Cards (2.5D Style)
            // วาดการ์ดปกติก่อน แล้วค่อยวาดการ์ดที่กำลังลากให้ซ้อนทับด้านบนสุด
            cards.forEach(c => { if(c !== draggedCard) drawSingleCard(c); });
            if (draggedCard) drawSingleCard(draggedCard);
        }

        function drawSingleCard(c) {
            ctx.save();
            // 2.5D Shadow
            ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
            ctx.shadowBlur = c === draggedCard ? 20 : 10;
            ctx.shadowOffsetY = c === draggedCard ? 15 : 5;
            
            // Card Background
            ctx.fillStyle = c.isLocked ? 'rgba(200, 255, 200, 0.95)' : 'rgba(255, 255, 255, 0.95)';
            ctx.beginPath();
            ctx.roundRect(c.x - c.w/2, c.y - c.h/2, c.w, c.h, 20);
            ctx.fill();
            ctx.shadowColor = 'transparent'; // ปิดเงาสำหรับเนื้อหา

            // Emoji
            ctx.font = '60px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(c.emoji, c.x, c.y - 15);

            // Text
            ctx.font = 'bold 24px Kanit';
            ctx.fillStyle = '#1e293b';
            ctx.fillText(c.word, c.x, c.y + 40);
            ctx.restore();
        }

        function drawTrackingAndCursor() {
            // Draw Hand Skeleton ถ้าพบมือ
            if (handDetected && latestHandResults && latestHandResults.multiHandLandmarks) {
                ctx.save();
                // พลิกแกน X สำหรับวาดกระดูกมือ ให้ตรงกับวีดีโอ
                ctx.translate(W, 0); 
                ctx.scale(-1, 1);
                for (const landmarks of latestHandResults.multiHandLandmarks) {
                    drawConnectors(ctx, landmarks, HAND_CONNECTIONS, {color: '#ffffff', lineWidth: 2});
                    drawLandmarks(ctx, landmarks, {color: '#3b82f6', lineWidth: 1, radius: 3});
                }
                ctx.restore();
            }

            if (!cursor.active) return;

            // Draw Custom Cursor
            ctx.save();
            ctx.beginPath();
            
            if (cursorState === 'normal') {
                ctx.arc(cursor.x, cursor.y, 15, 0, 2 * Math.PI);
                ctx.fillStyle = 'rgba(59, 130, 246, 0.7)'; // ฟ้า
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'white';
                ctx.stroke();
            } 
            else if (cursorState === 'hover') {
                ctx.arc(cursor.x, cursor.y, 20, 0, 2 * Math.PI);
                ctx.fillStyle = 'rgba(250, 204, 21, 0.4)'; // เหลือง
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#facc15';
                ctx.setLineDash([5, 5]);
                ctx.stroke();
            }
            else if (cursorState === 'grab_miss') {
                ctx.arc(cursor.x, cursor.y, 15, 0, 2 * Math.PI);
                ctx.fillStyle = 'rgba(239, 68, 68, 0.7)'; // แดง
                ctx.fill();
            }
            else if (cursorState === 'grab_success') {
                ctx.arc(cursor.x, cursor.y, 18, 0, 2 * Math.PI);
                ctx.fillStyle = 'rgba(34, 197, 94, 0.9)'; // เขียว
                ctx.fill();
                // วาดเครื่องหมายถูก ✔️
                ctx.fillStyle = 'white';
                ctx.font = '20px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('✔️', cursor.x, cursor.y);
            }
            ctx.restore();
        }

        // --- 9. Fallback Mouse/Touch Events ---
        function setupInputFallback() {
            const updateMouse = (e) => {
                mousePoint.x = e.clientX || (e.touches && e.touches[0].clientX);
                mousePoint.y = e.clientY || (e.touches && e.touches[0].clientY);
            };

            canvas.addEventListener('mousedown', (e) => { updateMouse(e); mousePoint.isDown = true; });
            canvas.addEventListener('mousemove', (e) => { if(mousePoint.active) updateMouse(e); });
            window.addEventListener('mouseup', () => { mousePoint.isDown = false; });

            canvas.addEventListener('touchstart', (e) => { updateMouse(e); mousePoint.isDown = true; });
            canvas.addEventListener('touchmove', (e) => { if(mousePoint.active) updateMouse(e); });
            window.addEventListener('touchend', () => { mousePoint.isDown = false; });
        }
    </script>
</body>
</html>
