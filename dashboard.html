<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>แดชบอร์ดนักกิจกรรมบำบัด · AR Thai Rehab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{
  --paper:#FBFBF9; --card:#FFFFFF; --ink:#16202B; --ink-2:#4A5A6B; --ink-3:#8496A6;
  --rule:#E1E7EB; --rule-2:#EFF3F5;
  --teal:#0F6E6E; --teal-2:#D7EAE8; --clay:#B4553F; --clay-2:#F6E2DC;
  --amber:#C08A2E; --amber-2:#F7EBD5; --marigold:#E8A33D;
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Thai",system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
button,input,select{font-family:inherit;font-size:inherit}
button{cursor:pointer} :focus-visible{outline:2px solid var(--teal);outline-offset:2px}
a{color:var(--teal)}

.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.rail{border-right:1px solid var(--rule);background:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:18px 18px 14px;border-bottom:1px solid var(--rule)}
.brand .mark{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.02em}
.brand .dot{width:9px;height:9px;border-radius:2px;background:var(--teal);transform:rotate(45deg)}
.brand .sub{font-size:11px;color:var(--ink-3);margin-top:3px;letter-spacing:.04em;text-transform:uppercase}
.nav{padding:10px;border-bottom:1px solid var(--rule)}
.nav button{display:flex;width:100%;gap:9px;align-items:center;background:none;border:0;padding:8px 10px;border-radius:7px;color:var(--ink-2);text-align:left}
.nav button:hover{background:var(--rule-2);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--teal-2);color:var(--teal);font-weight:600}
.plist{padding:10px;overflow:auto;flex:1}
.plist .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:0 10px 8px}
.plist button{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 10px;border-radius:7px;color:var(--ink-2);border-left:2px solid transparent}
.plist button:hover{background:var(--rule-2)}
.plist button.on{background:var(--rule-2);border-left-color:var(--teal);color:var(--ink);font-weight:600}
.plist .meta{font-size:11px;color:var(--ink-3);font-weight:400}
.railfoot{padding:10px;border-top:1px solid var(--rule);font-size:11.5px;color:var(--ink-3)}

.main{min-width:0}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid var(--rule);background:rgba(251,251,249,.94);backdrop-filter:blur(6px);position:sticky;top:0;z-index:5}
.crumb{font-size:12.5px;color:var(--ink-3);flex:1;min-width:0}
.crumb b{color:var(--ink);font-weight:600}
.chipbtn{border:1px solid var(--rule);background:#fff;border-radius:7px;padding:6px 11px;color:var(--ink-2);font-size:13px}
.chipbtn:hover{border-color:var(--ink-3)}
.chipbtn.primary{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
.chipbtn:disabled{opacity:.45;cursor:not-allowed}
.wrap{padding:20px 24px 60px;max-width:1340px}

.card{background:var(--card);border:1px solid var(--rule);border-radius:11px}
.card > header{padding:12px 16px;border-bottom:1px solid var(--rule-2);display:flex;align-items:baseline;gap:10px}
.card > header h3{font-size:14px}
.card > header .hint{font-size:11.5px;color:var(--ink-3);margin-left:auto;font-family:"IBM Plex Mono",monospace}
.card .body{padding:16px}
.grid{display:grid;gap:15px}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:1fr 1fr} .g32{grid-template-columns:1.35fr 1fr}
@media(max-width:1080px){.g4,.g3{grid-template-columns:repeat(2,1fr)}.g2,.g32{grid-template-columns:1fr}}
@media(max-width:820px){.shell{grid-template-columns:1fr}.rail{display:none}}
.sectlabel{display:flex;align-items:center;gap:10px;margin:24px 0 11px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.sectlabel::after{content:"";flex:1;height:1px;background:var(--rule)}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.tag i{width:6px;height:6px;border-radius:50%;background:currentColor;font-style:normal}
.t-up{background:var(--teal-2);color:#0B5A5A} .t-flat{background:var(--amber-2);color:#8A6316}
.t-down{background:var(--clay-2);color:#8E3E2C} .t-gone{background:#EFF1F3;color:#6B7A88}
.t-new{background:#E7EEF6;color:#3C5A7A}

table{width:100%;border-collapse:collapse}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);text-align:left;font-weight:600;padding:0 14px 9px}
td{padding:10px 14px;border-top:1px solid var(--rule-2);vertical-align:middle}
tbody tr.click:hover{background:#FAFCFC;cursor:pointer}
.pname{font-weight:600} .psub{font-size:11.5px;color:var(--ink-3)}

.tile .row{display:flex;align-items:flex-end;gap:8px}
.tile .val{font-size:29px;font-weight:600;letter-spacing:-.02em;line-height:1}
.tile .unit{font-size:12px;color:var(--ink-3);padding-bottom:3px}
.tile .cap{font-size:12px;color:var(--ink-2);margin-top:9px;line-height:1.45}
.delta{font-size:12px;font-weight:600;padding-bottom:3px}
.up{color:var(--teal)} .down{color:var(--clay)} .flat{color:var(--ink-3)}

.quality{display:inline-flex;gap:6px;align-items:center;font-size:11.5px;color:var(--ink-2);background:var(--rule-2);border-radius:6px;padding:4px 9px}
.quality.bad{background:var(--clay-2);color:#8E3E2C}
.legend{display:flex;gap:15px;font-size:12px;color:var(--ink-2);margin-top:10px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:2px;display:inline-block}
.flag{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--rule-2);font-size:13px;align-items:flex-start}
.flag:first-child{border-top:0} .flag .ic{width:18px;text-align:center;flex:none}
.note{background:#FCFCFA;border:1px solid var(--rule);border-left:3px solid var(--teal);border-radius:0 8px 8px 0;padding:15px 17px;font-size:13.5px;line-height:1.75}
.empty{text-align:center;padding:52px 20px;color:var(--ink-3)}
.empty .big{font-size:34px;margin-bottom:10px}
.hidden{display:none !important}
.banner{display:flex;gap:9px;align-items:flex-start;border-radius:8px;padding:9px 12px;font-size:12.5px;margin-bottom:18px}
.b-warn{background:var(--amber-2);border:1px solid #EBD7AE;color:#7A5A16}
.b-err{background:var(--clay-2);border:1px solid #E6C3B8;color:#8E3E2C}
.b-info{background:#EAF3F2;border:1px solid #C7DEDC;color:#0B5A5A}

.scrim{position:fixed;inset:0;background:rgba(22,32,43,.45);display:flex;align-items:flex-start;justify-content:center;padding:34px 18px;overflow:auto;z-index:50}
.sheet{background:#fff;width:760px;max-width:100%;border-radius:10px;box-shadow:0 24px 60px rgba(0,0,0,.24)}
.sheet .head{padding:14px 20px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:12px}
.sheet .doc{padding:28px 32px}
.doc .org{font-size:12px;color:var(--ink-3);letter-spacing:.04em}
.doc .rule{height:2px;background:var(--ink);margin:13px 0 17px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 14px;font-size:13px;margin-bottom:16px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0}
.doc td,.doc th{padding:7px 10px} .doc td:first-child,.doc th:first-child{padding-left:0}
.fld{display:block;margin-bottom:12px}
.fld span{display:block;font-size:12px;color:var(--ink-3);margin-bottom:4px}
.fld input,.fld select{width:100%;border:1px solid var(--rule);border-radius:8px;padding:9px 11px;background:#fff;color:var(--ink)}
@media print{.rail,.topbar,.sheet .head,.banner{display:none!important}.scrim{position:static;background:none;padding:0;display:block}.sheet{width:auto;box-shadow:none}body{background:#fff}}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand">
      <div class="mark"><span class="dot"></span> AR Thai Rehab</div>
      <div class="sub">แดชบอร์ดนักกิจกรรมบำบัด</div>
    </div>
    <nav class="nav">
      <button data-go="caseload" aria-current="true">📋 รายชื่อผู้ป่วย <span class="mono" id="navN" style="margin-left:auto;font-size:11px;color:var(--ink-3)"></span></button>
      <button data-go="patient">📈 ความก้าวหน้า</button>
      <button data-go="session">🔍 รายละเอียดครั้งที่เล่น</button>
    </nav>
    <div class="plist"><div class="lbl">ผู้ป่วย</div><div id="plist"></div></div>
    <div class="railfoot" id="railfoot">ยังไม่ได้โหลดข้อมูล</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="crumb" id="crumb"><b>รายชื่อผู้ป่วย</b></div>
      <button class="chipbtn" id="btnMask">🕶 ปกปิดชื่อ</button>
      <button class="chipbtn" id="btnCfg">⚙ ตั้งค่า</button>
      <button class="chipbtn" id="btnReload">↻ โหลดใหม่</button>
      <button class="chipbtn primary hidden" id="btnReport">สร้างรายงาน</button>
    </div>
    <div class="wrap">
      <div id="banners"></div>
      <section id="s-caseload"></section>
      <section id="s-patient" class="hidden"></section>
      <section id="s-session" class="hidden"></section>
    </div>
  </main>
</div>

<div class="scrim hidden" id="cfg"><div class="sheet" style="width:520px">
  <div class="head"><b>ตั้งค่าแหล่งข้อมูล</b>
    <button class="chipbtn" id="cfgClose" style="margin-left:auto">ปิด</button></div>
  <div class="doc" style="padding:22px 26px">
    <label class="fld"><span>Apps Script Web App URL (ลงท้ายด้วย /exec)</span>
      <input id="cfgUrl" placeholder="https://script.google.com/macros/s/…/exec" /></label>
    <label class="fld"><span>รหัสอ่านข้อมูล (ถ้าตั้ง READ_KEY ไว้)</span>
      <input id="cfgKey" placeholder="ไม่บังคับ" /></label>
    <label class="fld"><span>ช่วงเวลา</span>
      <select id="cfgSince">
        <option value="">ทั้งหมด</option><option value="30">30 วันล่าสุด</option>
        <option value="90" selected>90 วันล่าสุด</option><option value="180">180 วันล่าสุด</option>
      </select></label>
    <div id="cfgSrc" class="psub" style="margin:-4px 0 12px"></div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="chipbtn primary" id="cfgSave" style="flex:1">บันทึกและโหลด</button>
      <button class="chipbtn" id="cfgTest">ทดสอบการเชื่อมต่อ</button>
      <button class="chipbtn" id="cfgDemo">ดูตัวอย่าง</button>
    </div>
    <div id="cfgResult" class="hidden" style="margin-top:14px;font-size:12.5px;line-height:1.6"></div>
    <div style="border-top:1px solid var(--rule);margin-top:18px;padding-top:16px">
      <div style="font-size:12px;color:var(--ink-3);margin-bottom:8px">หรือเปิดจากไฟล์ CSV ที่ดาวน์โหลดจากเกม</div>
      <input type="file" id="cfgFile" accept=".csv,text/csv" />
    </div>
  </div>
</div></div>

<div class="scrim hidden" id="report"><div class="sheet">
  <div class="head"><b>รายงานความก้าวหน้า</b>
    <div style="margin-left:auto;display:flex;gap:8px">
      <button class="chipbtn" onclick="window.print()">พิมพ์ / บันทึก PDF</button>
      <button class="chipbtn" id="repClose">ปิด</button></div></div>
  <div class="doc" id="repBody"></div>
</div></div>

<script>
/* ===========================================================================
   1. ANALYTICS  (pure functions, no DOM)
   =========================================================================== */
/* ===========================================================================
   ANALYTICS — turns raw log rows into the numbers an OT reads.
   Kept free of DOM so it can be unit-tested on its own.
   =========================================================================== */

/* ---- quality gates. Bad data is excluded, never silently averaged in ---- */
const DCFG = (typeof window!=='undefined' && window.APP_CONFIG && window.APP_CONFIG.dashboard) || {};
const DG = DCFG.gates || {};
const GATE = {
  fpsMin      : DG.fpsMin       ?? 20,   // below this, velocity/smoothness are noise
  minDistPct  : DG.minDistPct   ?? 5,    // a nudge is not a reach
  minMovements: DG.minMovements ?? 10,   // per session, before it appears on a trend
  palmMin     : DG.palmMin      ?? 0.45  // hand turned edge-on → aperture foreshortened
};
const LAPSED_DAYS = DCFG.lapsedDays ?? 14;
const TREND_TH    = DCFG.trendThreshold ?? 8;

const num = v => { const n = parseFloat(v); return isFinite(n) ? n : null; };
const med = a => { if (!a.length) return null; const s=[...a].sort((x,y)=>x-y), m=s.length>>1;
                   return s.length%2 ? s[m] : (s[m-1]+s[m])/2; };
const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
const dayKey = ts => String(ts||'').slice(0,10);

/* ---- parse the wire format (columns + array rows) into objects ---- */
function parseRows(columns, rows){
  return rows.map(r => { const o={}; columns.forEach((c,i)=>o[c]=r[i]); return o; });
}

/* ---- group everything by session, apply gates, compute session metrics ---- */
function buildSessions(all){
  const bySid = new Map();
  for (const r of all){
    if (!r.sid) continue;
    if (!bySid.has(r.sid)) bySid.set(r.sid, { sid:r.sid, session:null, rounds:[], moves:[], pinch:null });
    const g = bySid.get(r.sid);
    if (r.type==='session')    g.session = r;
    else if (r.type==='round') g.rounds.push(r);
    else if (r.type==='movement') g.moves.push(r);
    else if (r.type==='pinchcheck') g.pinch = r;
  }

  const out = [];
  for (const g of bySid.values()){
    const s = g.session;
    // an unfinished session (browser closed) still has rounds; synthesise a header
    const head = s || g.rounds[0] || g.moves[0];
    if (!head) continue;

    const fps = num(s && s.fps_mean) ?? med(g.rounds.map(r=>num(r.fps_mean)).filter(v=>v!=null));
    const lowFps = fps != null && fps < GATE.fpsMin;

    // hand-driven rounds only: mouse rounds are not motor trials
    const handRounds = g.rounds.filter(r => r.input !== 'mouse');
    const mouseRounds = g.rounds.length - handRounds.length;
    const handSids = new Set(handRounds.map(r=>String(r.round)));
    const moves = g.moves.filter(m =>
      handSids.has(String(m.round)) &&
      (num(m.dist_pct) ?? 0) >= GATE.minDistPct);
    const apMoves = moves.filter(m => (num(m.palm_face) ?? 1) >= GATE.palmMin);
    const palmDropped = moves.length - apMoves.length;

    const valid = !lowFps && moves.length >= GATE.minMovements;

    const pick = (arr, k) => arr.map(m=>num(m[k])).filter(v=>v!=null);
    const rec = {
      sid: g.sid,
      ts: head.ts,
      day: dayKey(head.ts),
      key: head.player_key || '',
      name: head.display_name || head.player_key || '(ไม่ระบุ)',
      side: head.side || '', posture: head.posture || '', note: head.note || '',
      score: num(s && s.score) ?? 0,
      done: num(s && s.rounds_done) ?? g.rounds.filter(r=>String(r.completed)==='1').length,
      total: num(s && s.rounds_total) ?? null,
      qPerLevel: num(s && s.q_per_level),
      durationMs: num(s && s.duration_ms) ?? 0,
      endedEarly: String(s && s.ended_early) === '1',
      endReason: (s && s.end_reason) || (s ? '' : 'no-session-row'),
      fps, lowFps, mouseRounds, palmDropped,
      nMoves: moves.length, nRounds: g.rounds.length,
      valid,
      closeTh: num(s && s.grip_close_th), openTh: num(s && s.grip_open_th),

      // ---- movement quality (median: one dropped card must not move the mean)
      pathRatio : med(pick(moves,'path_ratio')),
      submoves  : med(pick(moves,'submoves')),
      moveMs    : med(pick(moves,'move_ms')),
      dropErr   : med(pick(moves,'drop_err_pct')),
      peakVel   : med(pick(moves,'peak_vel')),
      ttp       : med(pick(moves,'ttp_pct')),
      distPct   : med(pick(moves,'dist_pct')),

      // ---- grasp
      apMax   : med(pick(apMoves,'ap_max')),
      apMin   : med(pick(apMoves,'ap_min')),
      apExc   : med(pick(apMoves,'ap_exc')),
      closeMs : med(pick(apMoves,'close_ms')),
      releaseMs: med(pick(apMoves,'release_ms')),
      holdSd  : med(pick(apMoves,'hold_sd')),
      palmFace: avg(pick(moves,'palm_face')),
      graspMs : med(pick(moves,'grasp_ms')),
      pinchPct: moves.length ? moves.filter(m=>m.grasp==='pinch').length/moves.length*100 : null,

      // ---- cognitive vs motor
      planMs : med(pick(handRounds,'plan_ms')),
      solveMs: med(pick(handRounds,'solve_ms')),

      // ---- effort / errors
      failGrasp: avg(pick(handRounds,'fail_grasp')),
      attempts : avg(pick(handRounds,'attempts')),
      hints    : pick(g.rounds,'hint_used').reduce((a,b)=>a+b,0),
      noHandMs : pick(g.rounds,'no_hand_ms').reduce((a,b)=>a+b,0),

      // ---- pinch check (clean baseline, uncontaminated by reaching)
      pc: g.pinch ? {
        cycles:num(g.pinch.cycles), apMax:num(g.pinch.ap_max), apMin:num(g.pinch.ap_min),
        apExc:num(g.pinch.ap_exc), cycleMs:num(g.pinch.cycle_ms), palm:num(g.pinch.palm_face)
      } : null,

      rounds: g.rounds.sort((a,b)=>num(a.round)-num(b.round)),
      moves
    };

    // by-length breakdown for the difficulty table
    rec.byLen = {};
    [3,4,5].forEach(n=>{
      const rs = handRounds.filter(r=>num(r.n_words)===n);
      if (!rs.length) return;
      const ms = moves.filter(m=>{
        const r = handRounds.find(x=>String(x.round)===String(m.round));
        return r && num(r.n_words)===n;
      });
      rec.byLen[n] = {
        n: rs.length,
        firstTry: rs.filter(r=>num(r.attempts)===1).length/rs.length*100,
        moveMs: med(ms.map(m=>num(m.move_ms)).filter(v=>v!=null)),
        failGrasp: avg(rs.map(r=>num(r.fail_grasp)).filter(v=>v!=null))
      };
    });

    // fatigue: slope of move_ms across rounds, as % change over the session
    const pts = handRounds.map(r=>{
      const ms = moves.filter(m=>String(m.round)===String(r.round))
                      .map(m=>num(m.move_ms)).filter(v=>v!=null);
      return ms.length ? [num(r.round), med(ms)] : null;
    }).filter(Boolean);
    rec.fatiguePct = slopePct(pts);
    rec.fatiguePts = pts;

    out.push(rec);
  }
  return out.sort((a,b)=>String(a.ts).localeCompare(String(b.ts)));
}

/* least-squares slope expressed as % change from first to last x */
function slopePct(pts){
  if (pts.length < 4) return null;
  const n=pts.length, sx=pts.reduce((a,p)=>a+p[0],0), sy=pts.reduce((a,p)=>a+p[1],0);
  const sxx=pts.reduce((a,p)=>a+p[0]*p[0],0), sxy=pts.reduce((a,p)=>a+p[0]*p[1],0);
  const d=n*sxx-sx*sx; if (!d) return null;
  const b=(n*sxy-sx*sy)/d, a=(sy-b*sx)/n;
  const x0=pts[0][0], x1=pts[n-1][0];
  const y0=a+b*x0; if (!y0) return null;
  return ((a+b*x1)-y0)/y0*100;
}

/* ---- per-patient rollup ---- */
const METRICS = [
  { k:'pathRatio', label:'ความตรงของการเคลื่อนไหว', col:'path_ratio', lower:true,  fmt:v=>v.toFixed(2), unit:'' },
  { k:'submoves',  label:'ความนุ่มนวล',              col:'submoves',   lower:true,  fmt:v=>v.toFixed(1), unit:'ครั้ง/การเอื้อม' },
  { k:'moveMs',    label:'เวลาเอื้อม',                col:'move_ms',    lower:true,  fmt:v=>(v/1000).toFixed(2), unit:'วินาที' },
  { k:'dropErr',   label:'ความแม่นยำในการวาง',        col:'drop_err_pct',lower:true, fmt:v=>v.toFixed(1), unit:'% ของจอ' }
];

function buildPatients(sessions){
  const by = new Map();
  for (const s of sessions){
    const k = s.key || '(unknown)';
    if (!by.has(k)) by.set(k, { key:k, name:s.name, side:s.side, posture:s.posture, sessions:[] });
    const p = by.get(k);
    p.sessions.push(s);
    if (s.name) p.name = s.name;
    if (s.side) p.side = s.side;
    if (s.posture) p.posture = s.posture;
  }
  const now = Date.now();
  return [...by.values()].map(p=>{
    p.sessions.sort((a,b)=>String(a.ts).localeCompare(String(b.ts)));
    const good = p.sessions.filter(s=>s.valid);
    p.n = p.sessions.length;
    p.nValid = good.length;
    p.last = p.sessions[p.sessions.length-1];
    p.daysSince = p.last ? Math.floor((now - Date.parse(p.last.ts))/864e5) : 999;
    p.totalMoves = p.sessions.reduce((a,s)=>a+s.nMoves,0);
    p.totalMs = p.sessions.reduce((a,s)=>a+s.durationMs,0);
    p.perWeek = weeklyRate(p.sessions);
    p.change = {};
    METRICS.forEach(m=>{ p.change[m.k] = baselineChange(good, m); });
    p.status = statusOf(p);
    return p;
  }).sort((a,b)=>rank(a.status)-rank(b.status) || b.n-a.n);
}

/* compare the last 3 valid sessions against the first 3 — always signed so
   that positive = clinical improvement, whichever way the raw metric runs */
function baselineChange(sessions, m){
  const vals = sessions.map(s=>s[m.k]).filter(v=>v!=null);
  if (vals.length < 4) return null;
  const k = Math.min(3, Math.floor(vals.length/2));
  const base = avg(vals.slice(0,k)), now = avg(vals.slice(-k));
  if (!base) return null;
  const raw = (now-base)/Math.abs(base)*100;
  return { pct: m.lower ? -raw : raw, base, now, first:vals[0], last:vals[vals.length-1] };
}

function weeklyRate(sessions){
  if (sessions.length < 2) return sessions.length;
  const days = (Date.parse(sessions[sessions.length-1].ts) - Date.parse(sessions[0].ts))/864e5;
  return days > 0 ? sessions.length/(days/7) : sessions.length;
}

function statusOf(p){
  if (p.daysSince > LAPSED_DAYS) return 'gone';
  const ch = METRICS.map(m=>p.change[m.k]).filter(Boolean).map(c=>c.pct);
  if (ch.length < 2) return 'new';
  const mean = avg(ch);
  if (mean >=  TREND_TH) return 'up';
  if (mean <= -TREND_TH) return 'down';
  return 'flat';
}
const rank = s => ({down:0, gone:1, flat:2, new:3, up:4})[s] ?? 5;




/* ===========================================================================
   2. DATA LOADING
   Apps Script sits on a different origin from GitHub Pages, so a plain fetch
   is blocked by CORS. JSONP is used instead: the script tag is exempt.
   =========================================================================== */
/* config.js supplies the defaults; anything the user types in the settings
   dialog is stored as an override and wins until they clear it.            */
const RAW_CFG = (typeof window !== 'undefined' && window.APP_CONFIG) || {};
function CF(path, dflt){
  let v = RAW_CFG;
  for (const k of path.split('.')){
    if (v == null || typeof v !== 'object' || !(k in v)) return dflt;
    v = v[k];
  }
  return (v === undefined || v === null || v === '') ? dflt : v;
}
const ov = (k, dflt) => { const v = localStorage.getItem(k); return v === null ? dflt : v; };
const CFG = {
  get url(){ return ov('dash.url', CF('endpoint','')); },
  set url(v){ v === CF('endpoint','') ? localStorage.removeItem('dash.url') : localStorage.setItem('dash.url', v); },
  get key(){ return ov('dash.key', CF('readKey','')); },
  set key(v){ v === CF('readKey','') ? localStorage.removeItem('dash.key') : localStorage.setItem('dash.key', v); },
  get since(){ return ov('dash.since', String(CF('dashboard.sinceDays', 90))); },
  set since(v){ localStorage.setItem('dash.since', v); },
  get fromConfig(){ return localStorage.getItem('dash.url') === null && !!CF('endpoint',''); },
  clearOverrides(){ ['dash.url','dash.key','dash.since'].forEach(k=>localStorage.removeItem(k)); }
};
let DATA = { rows:[], sessions:[], patients:[], source:'', loadedAt:null };
const STATE = { view:'caseload', patient:null, session:null,
                masked: !!CF('dashboard.maskNames', false) };

/* The failure modes look identical from the outside, so distinguish them:
     onerror            → the URL is wrong / not reachable
     onload but no call → it responded, but not as JSONP  ⇒ stale deployment
     neither            → timeout                                            */
function jsonp(url, timeout=25000){
  return new Promise((res, rej)=>{
    const cb = 'dashcb_' + Math.random().toString(36).slice(2);
    const el = document.createElement('script');
    let called = false, loaded = false;
    const t = setTimeout(()=>{ cleanup(); rej(err(loaded ? 'stale' : 'timeout')); }, timeout);
    function cleanup(){ clearTimeout(t); delete window[cb]; el.remove(); }
    window[cb] = d => { called = true; cleanup(); res(d); };
    el.onload = ()=>{
      loaded = true;
      // a JSONP response calls the callback synchronously while executing
      setTimeout(()=>{ if (!called){ cleanup(); rej(err('stale')); } }, 60);
    };
    el.onerror = ()=>{ cleanup(); rej(err('unreachable')); };
    el.src = url + (url.includes('?')?'&':'?') + 'callback=' + cb;
    document.head.appendChild(el);
  });
}
const DIAG = {
  stale: 'endpoint ตอบกลับแล้ว แต่ไม่ใช่รูปแบบ JSONP — เกือบทั้งหมดเกิดจาก **ยังไม่ได้ deploy สคริปต์เวอร์ชันใหม่** ' +
         'การแก้ไฟล์ .gs อย่างเดียวไม่มีผลกับ URL เดิม ต้องไปที่ Deploy ▸ Manage deployments ▸ ✏️ ▸ Version: New version ▸ Deploy',
  unreachable: 'เรียก URL ไม่สำเร็จ — ตรวจว่า URL ลงท้ายด้วย /exec (ไม่ใช่ /dev) และ deploy แบบ “Anyone”',
  timeout: 'หมดเวลารอ — ชีตอาจมีข้อมูลมากเกินไป ลองจำกัดช่วงเวลาให้สั้นลง'
};
function err(code){ const e = new Error(DIAG[code] || code); e.code = code; return e; }

async function loadFromSheet(){
  if (!CFG.url) throw new Error('ยังไม่ได้ตั้งค่า URL');
  let u = CFG.url.trim() + '?action=data';
  if (CFG.key) u += '&key=' + encodeURIComponent(CFG.key);
  if (CFG.since){
    const d = new Date(Date.now() - (+CFG.since)*864e5).toISOString().slice(0,10);
    u += '&since=' + d;
  }
  const d = await jsonp(u);
  if (!d || !d.ok) throw new Error((d && d.error) || 'endpoint ตอบกลับผิดพลาด');
  return { rows: parseRows(d.columns, d.rows), source:'sheet' };
}

/* CSV from the game's own export — same columns, quoted, may contain BOM */
function parseCSV(text){
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows=[]; let row=[], cur='', q=false;
  for (let i=0;i<text.length;i++){
    const c=text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ cur+='"'; i++; } else q=false; }
      else cur+=c;
    } else if (c === '"') q=true;
    else if (c === ','){ row.push(cur); cur=''; }
    else if (c === '\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
    else if (c !== '\r') cur+=c;
  }
  if (cur.length || row.length){ row.push(cur); rows.push(row); }
  const cols = rows.shift().map(s=>s.trim());
  return parseRows(cols, rows.filter(r=>r.length>1));
}

function ingest(rows, source){
  DATA.rows = rows;
  DATA.sessions = buildSessions(rows);
  DATA.patients = buildPatients(DATA.sessions);
  DATA.source = source;
  DATA.loadedAt = new Date();
  STATE.patient = DATA.patients[0] || null;
  STATE.session = STATE.patient ? STATE.patient.last : null;
  renderAll();
}

const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const THDATE = ts => { const d=new Date(ts); return isNaN(d) ? '—' :
  d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'}); };
const THTIME = ts => { const d=new Date(ts); return isNaN(d) ? '' :
  d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}); };
const SIDE = {left:'ซ้าย',right:'ขวา',both:'ทั้งสองข้าง','':'—'};

const STATUS = {up:['ดีขึ้น','t-up'],flat:['คงที่','t-flat'],down:['ถดถอย','t-down'],
                gone:['ขาดการติดตาม','t-gone'],new:['ข้อมูลยังน้อย','t-new']};
const pname = p => STATE.masked ? ('ผู้ป่วย ' + (DATA.patients.indexOf(p)+1)) : p.name;

function sparkline(vals, lower, w=132, h=30){
  const v = vals.filter(x=>x!=null);
  if (v.length < 2) return '<span class="psub">ข้อมูลน้อย</span>';
  const mn=Math.min(...v), mx=Math.max(...v), r=(mx-mn)||1;
  const pts = v.map((x,i)=>[2+i/(v.length-1)*(w-4), h-4-((x-mn)/r)*(h-8)]);
  const improving = lower ? v[v.length-1] < v[0] : v[v.length-1] > v[0];
  const col = improving ? '#0F6E6E' : '#B4553F';
  return `<svg width="${w}" height="${h}" style="vertical-align:middle">
    <polyline fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round"
      points="${pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ')}"/>
    <circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="2.6" fill="${col}"/></svg>`;
}

/* line chart with a baseline band; y is inverted for "lower is better" */
function lineChart(vals, opts={}){
  const v = vals.filter(x=>x!=null);
  const W=250,H=52;
  if (v.length < 2) return `<div style="height:${H}px;display:flex;align-items:center;color:var(--ink-3);font-size:12px">ต้องมีอย่างน้อย 2 ครั้ง</div>`;
  const mn=Math.min(...v), mx=Math.max(...v), r=(mx-mn)||1;
  const X=i=>2+i/(v.length-1)*(W-4), Y=x=>H-6-((x-mn)/r)*(H-14);
  const k=Math.min(3,Math.floor(v.length/2));
  const base=v.slice(0,k).reduce((a,b)=>a+b,0)/k;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;margin-top:10px">
    <rect x="0" y="${(Y(base)-5).toFixed(1)}" width="${W}" height="10" fill="#EFF3F5"/>
    <polyline fill="none" stroke="#0F6E6E" stroke-width="2" stroke-linejoin="round"
      points="${v.map((x,i)=>X(i).toFixed(1)+','+Y(x).toFixed(1)).join(' ')}"/>
    <circle cx="${X(v.length-1).toFixed(1)}" cy="${Y(v[v.length-1]).toFixed(1)}" r="3" fill="#0F6E6E"/>
  </svg>`;
}

function barChart(items, opts={}){
  const W=640,H=opts.h||190, pad=30;
  const max=Math.max(...items.map(d=>d.a+(d.b||0)),1e-6);
  const bw=Math.min(34,(W-2*pad)/Math.max(items.length,1)*0.7);
  let out=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">`;
  items.forEach((d,i)=>{
    const x=items.length===1?W/2:pad+i/(items.length-1)*(W-2*pad);
    const base=H-26, ha=(d.a/max)*(H-46), hb=((d.b||0)/max)*(H-46);
    out+=`<rect x="${(x-bw/2).toFixed(1)}" y="${(base-ha).toFixed(1)}" width="${bw.toFixed(1)}" height="${ha.toFixed(1)}" fill="${opts.ca||'#8496A6'}" rx="2"/>`;
    if (d.b) out+=`<rect x="${(x-bw/2).toFixed(1)}" y="${(base-ha-hb).toFixed(1)}" width="${bw.toFixed(1)}" height="${hb.toFixed(1)}" fill="${opts.cb||'#0F6E6E'}" rx="2"/>`;
    if (d.mark) out+=`<circle cx="${x.toFixed(1)}" cy="${(base-ha-hb-11).toFixed(1)}" r="4" fill="#E8A33D"/>`;
    if (d.label && (items.length<=16 || i%Math.ceil(items.length/12)===0))
      out+=`<text x="${x.toFixed(1)}" y="${H-8}" font-size="10.5" fill="#8496A6" text-anchor="middle">${esc(d.label)}</text>`;
  });
  out+=`<line x1="${pad-10}" y1="${H-26}" x2="${W-pad+10}" y2="${H-26}" stroke="#DDE3E8"/></svg>`;
  return out;
}
</script>
<script>
/* ===========================================================================
   DEMO DATA — synthetic rows in exactly the log's schema, so the whole
   pipeline (gates, aggregation, charts) is exercised without a backend.
   =========================================================================== */
function demoRows(){
  const COLS=['type','ts','sid','player_key','display_name','note','side','posture','round','stage','q','mv','sent_id','sent_th','n_words','card_th','grasp','plan_ms','solve_ms','move_ms','grasp_ms','path_pct','dist_pct','path_ratio','peak_vel','ttp_pct','submoves','drop_err_pct','to_slot','attempts','misplaced','pickups','fail_grasp','hint_used','completed','ap_max','ap_min','ap_exc','close_ms','release_ms','hold_sd','palm_face','cycles','cycle_ms','grip_close_th','grip_open_th','score','rounds_done','rounds_total','q_per_level','duration_ms','no_hand_ms','ended_early','end_reason','input','fps_mean','fps_min','screen','ua','app','bank'];
  let seed=7; const rnd=()=>((seed=seed*16807%2147483647)-1)/2147483646;
  const rows=[]; const push=o=>rows.push(COLS.map(c=>o[c]===undefined?'':o[c]));
  const WORDS=['ฉัน','กิน','ข้าว','แมว','ปลา','นก','บิน','บน','ท้องฟ้า','แม่','ทำ','อาหาร'];
  const PT=[
    {k:'p-001',n:'สมชาย ก.',side:'right',pose:'sit',s:14,imp:1.0,note:'สัปดาห์ที่ 8'},
    {k:'p-007',n:'ประยุทธ ว.',side:'right',pose:'sit',s:9,imp:-0.45,note:''},
    {k:'p-011',n:'สุดา จ.',side:'both',pose:'stand',s:4,imp:0.15,note:'เริ่มใหม่'},
    {k:'p-003',n:'มานี ส.',side:'left',pose:'wheelchair',s:6,imp:0.5,stale:21,note:''},
  ];
  const today=Date.now();
  for (const p of PT){
    for (let s=0;s<p.s;s++){
      const prog=(s/((p.s-1)||1))*p.imp;
      const back=(p.s-1-s)*4.1 + (p.stale||0) + (PT.indexOf(p)*0.7);
      const ts=new Date(today-back*864e5).toISOString();
      const sid=p.k+'-s'+s;
      const base={ts,sid,player_key:p.k,display_name:p.n,note:p.note,side:p.side,posture:p.pose,
        app:'2.0-rehab',bank:1,screen:'1440x900',ua:'Chrome'};
      const badFps=(p.k==='p-007'&&s===2), mouse=(p.k==='p-011'&&s===1);
      const fps=badFps?14.2:(26+rnd()*4);
      push(Object.assign({},base,{type:'pinchcheck',cycles:5,
        ap_max:(1.30+prog*0.12).toFixed(3),ap_min:(0.52-prog*0.10).toFixed(3),
        ap_exc:(0.78+prog*0.22).toFixed(3),cycle_ms:Math.round(900-prog*220),
        palm_face:0.80,grip_close_th:0.62,grip_open_th:0.95}));
      const nR=15, done=(p.k==='p-001'&&s>=p.s-2)?9:(p.k==='p-007'&&s>6)?11:nR;
      for (let r=1;r<=done;r++){
        const nw=r<=5?3:r<=10?4:5, fat=1+(r/done)*(p.k==='p-001'&&s>=p.s-2?0.34:0.12);
        push(Object.assign({},base,{type:'round',round:r,stage:Math.ceil(r/5),q:((r-1)%5)+1,
          sent_id:'L'+nw+'-'+String((r%9)+1).padStart(2,'0'),
          sent_th:'ประโยคตัวอย่าง',n_words:nw,
          plan_ms:Math.round((2600+nw*320)*(1-prog*0.05)*(0.9+rnd()*0.2)),
          solve_ms:Math.round((5200+nw*720)*(1-prog*0.26)*fat),
          attempts:rnd()<(0.62+prog*0.18)?1:2, misplaced:rnd()<0.75?0:2, pickups:nw,
          fail_grasp:Math.max(0,Math.round((1.2-prog*0.8)*rnd()*2)),
          hint_used:rnd()<0.12?1:0, completed:1, input:mouse?'mouse':'hand',
          no_hand_ms:Math.round(rnd()*2500), fps_mean:fps.toFixed(1), fps_min:(fps-5).toFixed(1)}));
        for (let w=0;w<nw;w++){
          const edge=rnd()<0.05;
          push(Object.assign({},base,{type:'movement',round:r,mv:w+1,
            card_th:WORDS[(r*3+w)%WORDS.length],
            grasp: rnd()<(0.34+prog*0.28)?'pinch':'fist',
            move_ms:Math.round((1900-prog*520)*fat*(0.9+rnd()*0.2)),
            grasp_ms:Math.round(400-prog*90),
            path_pct:(58*(1+rnd()*0.25)).toFixed(2),
            dist_pct: edge?2.1:(46+rnd()*14).toFixed(2),
            path_ratio:((1.62-prog*0.34)*(0.95+rnd()*0.1)).toFixed(2),
            peak_vel:(100+prog*28).toFixed(2), ttp_pct:(44+rnd()*8).toFixed(1),
            submoves:Math.max(1,Math.round(4.8-prog*1.7+rnd()*1.2)),
            drop_err_pct:((6.2-prog*1.8)*(0.9+rnd()*0.2)).toFixed(2), to_slot:w+1,
            ap_max:(1.35+prog*0.10).toFixed(3), ap_min:(0.48-prog*0.06).toFixed(3),
            ap_exc:(0.87+prog*0.16).toFixed(3),
            close_ms:Math.round(440-prog*120), release_ms:Math.round(960-prog*350),
            hold_sd:(0.038-prog*0.017).toFixed(3),
            palm_face: edge?0.28:(0.72+rnd()*0.18).toFixed(2)}));
        }
      }
      push(Object.assign({},base,{type:'session',score:done*100,rounds_done:done,rounds_total:nR,
        q_per_level:5,duration_ms:done*62000+Math.round(rnd()*40000),
        ended_early:done<nR?1:0,end_reason:done<nR?'early':'finished',
        fps_mean:fps.toFixed(1),fps_min:(fps-5).toFixed(1),
        grip_close_th:0.62,grip_open_th:0.95}));
    }
  }
  return parseRows(COLS,rows);
}

const stat=(l,v)=>`<div><div class="psub">${l}</div><div class="mono" style="font-size:20px;font-weight:600">${v}</div></div>`;
const miniTile=(l,col,v,u)=>`<div class="card tile"><div class="body">
  <div class="psub" style="margin-bottom:7px">${l} <span class="mono" style="font-size:10.5px;opacity:.55">${col}</span></div>
  <div class="row"><span class="val mono">${v}</span>${u?`<span class="unit">${u}</span>`:''}</div></div></div>`;

function dualNote(good){
  if (good.length<4) return '';
  const k=Math.min(3,Math.floor(good.length/2));
  const p0=avg(good.slice(0,k).map(s=>s.planMs).filter(v=>v!=null));
  const p1=avg(good.slice(-k).map(s=>s.planMs).filter(v=>v!=null));
  const m0=avg(good.slice(0,k).map(s=>s.solveMs).filter(v=>v!=null));
  const m1=avg(good.slice(-k).map(s=>s.solveMs).filter(v=>v!=null));
  if (!p0||!m0) return '';
  const dp=(p1-p0)/p0*100, dm=(m1-m0)/m0*100;
  let t;
  if (dm < -8 && Math.abs(dp) < 8) t='เวลาแก้โจทย์ลดลงขณะที่เวลาคิดคงที่ — การพัฒนามาจากด้านการเคลื่อนไหว จึงยังเพิ่มความยากด้านภาษาได้';
  else if (dp < -8 && dm > -8) t='เวลาคิดลดลงเป็นหลัก — อาจคุ้นเคยกับชุดประโยคแล้ว ควรสลับประโยคหรือเพิ่มจำนวนคำ';
  else if (dm < -8 && dp < -8) t='ดีขึ้นทั้งด้านการคิดและการเคลื่อนไหว';
  else t='ยังไม่เห็นการเปลี่ยนแปลงชัดเจนในทั้งสองด้าน';
  return `<div style="font-size:13px;color:var(--ink-2);margin-top:12px;line-height:1.6">${t}
    <span class="psub">(เวลาคิด ${pct(dp)} · เวลาแก้โจทย์ ${pct(dm)})</span></div>`;
}

function suggestionCard(p, good, lens){
  const last=good.at(-1);
  let head='ยังไม่พอสำหรับข้อเสนอ', body='ต้องมีข้อมูลที่ใช้ได้อย่างน้อย 3 ครั้ง';
  if (good.length>=3 && last){
    const early=p.sessions.slice(-3).filter(s=>s.endedEarly).length;
    const fat=last.fatiguePct;
    const hard=lens[5]?avg(lens[5].map(x=>x.firstTry)):null;
    const mid =lens[4]?avg(lens[4].map(x=>x.firstTry)):null;
    if (early>=2 || (fat!=null && fat>25)){
      head='ลดจำนวนข้อต่อด่าน หรือแบ่งเป็นช่วงสั้นลง';
      body=`พบ${early>=2?`การจบก่อนกำหนด ${early} ใน 3 ครั้งล่าสุด`:''}${early>=2&&fat>25?' และ':''}${fat>25?`เวลาเอื้อมเพิ่มขึ้น ${fat.toFixed(0)}% ภายในครั้งล่าสุด`:''} ซึ่งเป็นรูปแบบของความล้า`;
    } else if (hard!=null && hard>=75){
      head='เพิ่มจำนวนข้อต่อด่าน หรือคงระดับ 5 คำแล้วเน้นความแม่นยำ';
      body=`ระดับ 5 คำ สำเร็จครั้งแรก ${Math.round(hard)}% และไม่พบความล้าภายในครั้ง`;
    } else if (mid!=null && mid>=75){
      head='เพิ่มสัดส่วนข้อระดับ 5 คำ';
      body=`ระดับ 4 คำ สำเร็จครั้งแรก ${Math.round(mid)}% แล้ว`;
    } else {
      head='คงระดับความยากเดิมไว้ก่อน';
      body='ความสำเร็จครั้งแรกยังต่ำกว่า 75% ในระดับที่เล่นอยู่';
    }
  }
  return `<div class="card" style="border-color:#BCD9D6;background:linear-gradient(180deg,#F4FAF9,#fff)">
    <header style="border-bottom-color:#DDEDEB"><h3>ข้อเสนอสำหรับครั้งถัดไป</h3></header>
    <div class="body"><div style="font-size:15px;font-weight:600;color:var(--teal);margin-bottom:8px">${head}</div>
    <div style="font-size:13px;color:var(--ink-2);line-height:1.65">${body}</div>
    <div class="psub" style="margin-top:12px">ข้อเสนอนี้คำนวณจากข้อมูลเท่านั้น การตัดสินใจขึ้นกับนักกิจกรรมบำบัด</div>
    </div></div>`;
}

function renderSession(){

  const flags=[];
  if (s.endedEarly) flags.push(['⏹',`จบเกมก่อนกำหนดที่ข้อ ${s.done+1}`,

  <div class="grid g4" style="margin-bottom:16px">

      <div class="body">${barChart(rounds,{ca:'#8496A6',cb:'#0F6E6E',h:220})}
        <div class="legend"><span><i style="background:#8496A6"></i> เวลาคิด</span>
          <span><i style="background:#0F6E6E"></i> เวลาแก้โจทย์</span>
          <span><i style="background:#E8A33D"></i> ตอบผิดครั้งแรก</span></div></div></div>
    <div class="card"><header><h3>สิ่งที่ควรทราบ</h3></header><div class="body">
      ${flags.map(([ic,t,sub])=>`<div class="flag"><span class="ic">${ic}</span>
        <div><b>${t}</b>${sub?`<div class="psub">${sub}</div>`:''}</div></div>`).join('')}
    </div></div>
  </div>

  <div class="sectlabel">การจับในครั้งนี้</div>
  <div class="grid g4">
    ${miniTile('ระยะเปิด–ปิดนิ้ว','ap_exc', n2(s.apExc))}
    ${miniTile('เวลาปิดมือ','close_ms', secs(s.closeMs),'วินาที')}
    ${miniTile('เวลาปล่อย','release_ms', secs(s.releaseMs),'วินาที')}
    ${miniTile('ความนิ่งขณะถือ','hold_sd', n2(s.holdSd))}
  </div>
  ${s.pc?`<div class="card" style="margin-top:15px"><header><h3>แบบทดสอบเปิด–ปิดมือ ก่อนเริ่มเล่น</h3>
    <span class="hint">type = pinchcheck</span></header><div class="body" style="display:flex;gap:28px;flex-wrap:wrap">
    ${stat('จำนวนรอบ', s.pc.cycles)}${stat('เปิดสุด', n2(s.pc.apMax))}${stat('ปิดสุด', n2(s.pc.apMin))}
    ${stat('ระยะเปิด–ปิด', n2(s.pc.apExc))}${stat('เวลาต่อรอบ', secs(s.pc.cycleMs)+' วิ')}
    </div></div>`:''}

  <div class="sectlabel">ข้อมูลการเคลื่อนไหวรายครั้ง</div>
  <div class="card"><div class="body" style="padding:14px 2px 6px;overflow-x:auto">
    <table class="mono" style="font-size:12px;min-width:700px">
    <thead><tr><th style="padding-left:14px">ข้อ</th><th>คำ</th><th>การจับ</th><th>move_ms</th>
      <th>path_ratio</th><th>submoves</th><th>ap_exc</th><th>close_ms</th><th>release_ms</th><th>drop_err</th></tr></thead>
    <tbody>${s.moves.slice(0,40).map(m=>`<tr>
      <td style="padding-left:14px">${esc(m.round)}</td><td>${esc(m.card_th)}</td>
      <td>${m.grasp==='pinch'?'จีบนิ้ว':m.grasp==='fist'?'กำมือ':esc(m.grasp)}</td>
      <td>${esc(m.move_ms)}</td><td>${esc(m.path_ratio)}</td><td>${esc(m.submoves)}</td>
      <td>${esc(m.ap_exc)}</td><td>${esc(m.close_ms)}</td><td>${esc(m.release_ms)||'—'}</td>
      <td>${esc(m.drop_err_pct)}</td></tr>`).join('')}</tbody></table>
    ${s.moves.length>40?`<div class="psub" style="padding:10px 14px">แสดง 40 จาก ${s.moves.length} รายการ</div>`:''}
  </div></div>

  <div class="sectlabel">บันทึกอัตโนมัติ</div>
  <div class="card"><div class="body">
    <div class="note" id="autonote">${esc(sessionNote(s,idx))}</div>
    <button class="chipbtn primary" id="copynote" style="margin-top:12px">คัดลอกข้อความ</button>
  </div></div>`;

  $('copynote').onclick=e=>{
    navigator.clipboard?.writeText($('autonote').textContent);
    e.target.textContent='คัดลอกแล้ว'; setTimeout(()=>e.target.textContent='คัดลอกข้อความ',1600);
  };
}

function sessionNote(s, idx){
  const parts=[];
  parts.push(`ผู้ป่วยเข้ารับการฝึกด้วยเกม AR เรียงประโยคภาษาไทย ครั้งที่ ${idx} วันที่ ${THDATE(s.ts)}`);
  parts.push(`ใช้${SIDE[s.side]??'มือ'}ในท่า${POSE[s.posture]??'ที่กำหนด'}`);
  parts.push(`เล่นได้ ${s.done}${s.total?' จาก '+s.total:''} ข้อ${s.endedEarly?' ก่อนยุติการฝึกเองที่นาทีที่ '+mins(s.durationMs):''}`);
  parts.push(`รวมการเคลื่อนไหว ${s.nMoves} ครั้ง`);
  if (s.moveMs!=null) parts.push(`เวลาเอื้อมเฉลี่ย ${secs(s.moveMs)} วินาที`);
  if (s.pathRatio!=null) parts.push(`ความตรงของการเคลื่อนไหว ${n2(s.pathRatio)}`);
  if (s.submoves!=null) parts.push(`ความนุ่มนวล ${n1(s.submoves)} ครั้งต่อการเอื้อม`);
  if (s.closeMs!=null&&s.releaseMs!=null)
    parts.push(`เวลาปิดมือ ${secs(s.closeMs)} วินาที เวลาปล่อย ${secs(s.releaseMs)} วินาที`);
  if (s.pinchPct!=null) parts.push(`ใช้การจีบนิ้วร้อยละ ${Math.round(s.pinchPct)} ของการหยิบ`);
  if (s.fatiguePct!=null&&s.fatiguePct>15)
    parts.push(`พบเวลาเอื้อมเพิ่มขึ้นร้อยละ ${s.fatiguePct.toFixed(0)} ระหว่างการฝึก ซึ่งสอดคล้องกับความล้า`);
  if (!s.valid) parts.push('หมายเหตุ ข้อมูลครั้งนี้ไม่ผ่านเกณฑ์คุณภาพจึงไม่นำไปคำนวณแนวโน้ม');
  return parts.join(' ') + '.';
}

/* ---------------- report ---------------- */
function buildReport(){
  const p=STATE.patient; if(!p) return;
  const good=p.sessions.filter(s=>s.valid);
  const rows=METRICS.map(m=>{
    const c=p.change[m.k];
    if (!c) return `<tr><td>${m.label}</td><td class="mono">—</td><td class="mono">—</td><td class="mono">—</td></tr>`;
    const f=v=>m.k==='moveMs'?secs(v)+' วิ':m.fmt(v);
    return `<tr><td>${m.label}</td><td class="mono">${f(c.base)}</td><td class="mono">${f(c.now)}</td>
      <td class="mono" style="color:${c.pct>0?'var(--teal)':'var(--clay)'}">${c.pct>0?'ดีขึ้น':'ลดลง'} ${Math.abs(c.pct).toFixed(0)}%</td></tr>`;
  }).join('');
  const early=p.sessions.filter(s=>s.endedEarly).length;
  const pinch0=good.find(s=>s.pinchPct!=null), pinch1=[...good].reverse().find(s=>s.pinchPct!=null);
  $('repBody').innerHTML=`
    <div class="org">${esc(CF("dashboard.clinicName","แผนกกิจกรรมบำบัด"))}</div>
    <h2 style="font-size:17px">รายงานความก้าวหน้าการฝึกด้วยเกม AR เรียงประโยคภาษาไทย</h2>
    <div class="rule"></div>
    <dl class="kv">
      <dt>ผู้ป่วย</dt><dd>${esc(pname(p))}</dd>
      <dt>ข้างที่ฝึก</dt><dd>${SIDE[p.side]??p.side} · ท่า${POSE[p.posture]??p.posture}</dd>
      <dt>ช่วงรายงาน</dt><dd>${THDATE(p.sessions[0].ts)} – ${THDATE(p.last.ts)} (${p.n} ครั้ง${p.nValid<p.n?`, ใช้คำนวณได้ ${p.nValid} ครั้ง`:''})</dd>
      <dt>ปริมาณการฝึก</dt><dd>รวม ${Math.floor(p.totalMs/3600000)} ชั่วโมง ${Math.round(p.totalMs%3600000/60000)} นาที ·
        ${p.totalMoves.toLocaleString()} การเคลื่อนไหว · เฉลี่ย ${p.perWeek.toFixed(1)} ครั้ง/สัปดาห์</dd>
    </dl>
    <h3 style="font-size:13px;margin-bottom:6px">ผลการฝึก</h3>
    <table style="font-size:13px"><thead><tr><th>ตัวชี้วัด</th><th>ช่วงเริ่มต้น</th><th>ปัจจุบัน</th><th>เปลี่ยนแปลง</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <h3 style="font-size:13px;margin-bottom:6px">สรุป</h3>
    <p style="font-size:13px;line-height:1.75;margin-top:4px">
      ผู้ป่วยเข้ารับการฝึกรวม ${p.n} ครั้ง เฉลี่ย ${p.perWeek.toFixed(1)} ครั้งต่อสัปดาห์
      ${early?`มีการยุติการฝึกก่อนกำหนด ${early} ครั้ง `:''}
      ${pinch0&&pinch1&&pinch0!==pinch1?`สัดส่วนการใช้จีบนิ้วเปลี่ยนจากร้อยละ ${Math.round(pinch0.pinchPct)} เป็นร้อยละ ${Math.round(pinch1.pinchPct)} `:''}
      ${p.status==='up'?'ตัวชี้วัดคุณภาพการเคลื่อนไหวโดยรวมดีขึ้น':
        p.status==='down'?'ตัวชี้วัดคุณภาพการเคลื่อนไหวโดยรวมมีแนวโน้มถดถอย ควรทบทวนโปรแกรมการฝึก':
        p.status==='flat'?'ตัวชี้วัดคุณภาพการเคลื่อนไหวโดยรวมค่อนข้างคงที่':
        'ข้อมูลยังไม่พอสำหรับสรุปแนวโน้ม'}
    </p>
    <div style="margin-top:24px;display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-3)">
      <div>ผู้บันทึก ............................................</div><div>วันที่ ${THDATE(new Date())}</div></div>
    <p style="margin-top:18px;font-size:11px;color:var(--ink-3);line-height:1.6;border-top:1px solid var(--rule);padding-top:10px">
      ข้อมูลจากการติดตามด้วยกล้องเว็บแคม (markerless) ใช้เพื่อเปรียบเทียบการเปลี่ยนแปลงของผู้ป่วยรายเดิมข้ามครั้งเท่านั้น
      ไม่ใช่แบบประเมินมาตรฐาน ไม่สามารถวัดแรงบีบได้ และไม่ควรใช้เทียบระหว่างบุคคลหรือเทียบกับค่าปกติ</p>`;
  $('report').classList.remove('hidden');
}

/* ===========================================================================
   5. NAVIGATION + BOOT
   =========================================================================== */
const CRUMB={caseload:()=>'<b>รายชื่อผู้ป่วย</b>',
  patient:()=>`รายชื่อผู้ป่วย · <b>${esc(STATE.patient?pname(STATE.patient):'')}</b> · ความก้าวหน้า`,
  session:()=>`รายชื่อผู้ป่วย · ${esc(STATE.patient?pname(STATE.patient):'')} · <b>${THDATE(STATE.session?STATE.session.ts:'')}</b>`};
function go(v){
  if ((v==='patient'||v==='session') && !STATE.patient) v='caseload';
  STATE.view=v;
  ['caseload','patient','session'].forEach(k=>$('s-'+k).classList.toggle('hidden',k!==v));
  document.querySelectorAll('.nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.go===v));
  $('crumb').innerHTML=CRUMB[v]();
  $('btnReport').classList.toggle('hidden', v==='caseload' || !STATE.patient);
  window.scrollTo(0,0);
}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.go));
$('btnReport').onclick=buildReport;
$('repClose').onclick=()=>$('report').classList.add('hidden');
$('btnMask').textContent = STATE.masked ? '👁 แสดงชื่อ' : '🕶 ปกปิดชื่อ';
$('btnMask').onclick=()=>{ STATE.masked=!STATE.masked;
  $('btnMask').textContent = STATE.masked?'👁 แสดงชื่อ':'🕶 ปกปิดชื่อ'; renderAll(); };

$('btnCfg').onclick=()=>{
  $('cfgUrl').value=CFG.url; $('cfgKey').value=CFG.key; $('cfgSince').value=CFG.since;
  $('cfgSrc').innerHTML = CFG.fromConfig
    ? '✓ ค่าเริ่มต้นมาจากไฟล์ <span class="mono">config.js</span> — แก้ที่นี่จะบันทึกทับเฉพาะเครื่องนี้'
    : (CF('endpoint','')
        ? 'กำลังใช้ค่าที่ตั้งไว้เฉพาะเครื่องนี้ · <button id="cfgReset" class="underline">กลับไปใช้ค่าจาก config.js</button>'
        : '⚠️ ยังไม่ได้ตั้ง <span class="mono">endpoint</span> ในไฟล์ <span class="mono">config.js</span>');
  const r=$('cfgReset'); if (r) r.onclick=()=>{ CFG.clearOverrides(); $('btnCfg').onclick(); reload(); };
  $('cfg').classList.remove('hidden');
};
$('cfgClose').onclick=()=>$('cfg').classList.add('hidden');
$('cfgSave').onclick=async()=>{
  CFG.url=$('cfgUrl').value.trim(); CFG.key=$('cfgKey').value.trim(); CFG.since=$('cfgSince').value;
  $('cfg').classList.add('hidden'); await reload();
};
$('cfgDemo').onclick=()=>{ $('cfg').classList.add('hidden'); ingest(demoRows(),'demo'); };
$('cfgTest').onclick=async()=>{
  const box=$('cfgResult'); box.classList.remove('hidden');
  const url=$('cfgUrl').value.trim();
  if (!url){ box.innerHTML='<span style="color:var(--clay)">ยังไม่ได้ใส่ URL</span>'; return; }
  if (!/\/exec$/.test(url)){
    box.innerHTML='<span style="color:var(--clay)">URL ต้องลงท้ายด้วย <span class="mono">/exec</span> (ไม่ใช่ /dev หรือ /edit)</span>'; return; }
  box.textContent='กำลังทดสอบ…';
  let u=url+'?action=data'; const k=$('cfgKey').value.trim();
  if (k) u+='&key='+encodeURIComponent(k);
  try{
    const d=await jsonp(u, 15000);
    if (!d.ok) throw new Error(d.error||'endpoint ตอบกลับว่าไม่สำเร็จ');
    const types={}; const ti=d.columns.indexOf('type');
    d.rows.forEach(r=>{ const t=r[ti]||'?'; types[t]=(types[t]||0)+1; });
    box.innerHTML=`<span style="color:var(--teal)">✓ เชื่อมต่อได้</span> —
      ${d.rows.length.toLocaleString()} แถว · ${d.columns.length} คอลัมน์<br>
      <span class="mono" style="font-size:11.5px">${esc(Object.entries(types).map(([k,v])=>k+':'+v).join(' · '))}</span>
      ${d.columns.includes('ap_exc')?'':'<br><span style="color:var(--clay)">⚠️ ไม่พบคอลัมน์ ap_exc — ชีตยังเป็นสคีมาเก่า ให้ deploy สคริปต์ใหม่แล้วเล่นเกมอีกครั้ง</span>'}`;
  }catch(e){
    box.innerHTML=`<span style="color:var(--clay)">✕ ${esc(e.message).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}</span>`;
  }
};
$('cfgFile').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{ ingest(parseCSV(rd.result),'csv'); $('cfg').classList.add('hidden'); }
                  catch(err){ showError('อ่านไฟล์ CSV ไม่สำเร็จ: '+err.message); } };
  rd.readAsText(f,'utf-8');
};
$('btnReload').onclick=reload;

function showError(msg, url, code){
  const bold = esc(msg).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  const extra = url ? `<div style="margin-top:8px">
      เปิด URL นี้ในแท็บใหม่เพื่อตรวจสอบ:
      <a href="${esc(url)}" target="_blank" rel="noopener" style="word-break:break-all">${esc(url)}</a>
      <div style="margin-top:6px;font-size:12px">
        เห็นข้อความ <span class="mono">AR Thai stats endpoint is running.</span> = ยังเป็นสคริปต์เวอร์ชันเก่า ·
        เห็น <span class="mono">{"ok":true…}</span> = สคริปต์ถูกต้องแล้ว
      </div></div>` : '';
  $('banners').innerHTML =
    `<div class="banner b-err">⚠️ <div>${bold}${extra}</div></div>` + $('banners').innerHTML;
}
async function reload(){
  if (!CFG.url){ $('cfg').classList.remove('hidden'); return; }
  $('btnReload').disabled=true; $('btnReload').textContent='กำลังโหลด…';
  try{ const d=await loadFromSheet(); ingest(d.rows,'sheet'); }
  catch(e){
    renderAll();
    const url = CFG.url.trim() + '?action=data';
    showError('โหลดข้อมูลไม่สำเร็จ — ' + e.message, url, e.code);
  }
  finally{ $('btnReload').disabled=false; $('btnReload').textContent='↻ โหลดใหม่'; }
}

/* boot */
if (CFG.url) reload(); else { ingest(demoRows(),'demo'); $('cfg').classList.remove('hidden'); }
</script>
</body>
</html>
